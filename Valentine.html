<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Valentine 💖</title>
    <style>
        body { margin:0; height:100vh; background-color:#f8c8dc; display:flex; justify-content:center; align-items:center; font-family:Arial,sans-serif; }
        .card { background:white; padding:40px; border-radius:20px; text-align:center; box-shadow:0 10px 30px rgba(0,0,0,0.15); width:90%; max-width:400px; }
        h1 { margin-bottom:30px; color:#d63384; }
        .buttons { position:relative; height:80px; }
        button { padding:12px 25px; font-size:18px; border:none; border-radius:10px; cursor:pointer; }
        #yesBtn { background-color:#ff4d6d; color:white; margin-right:20px; }
        #noBtn { background-color:#ccc; position:absolute; }
        #yay { font-size:32px; color:#ff4d6d; display:none; margin-top:20px; font-weight:bold; }
        #meme { display:none; margin-top:20px; max-width:100%; border-radius:15px; }
    </style>
</head>
<body>
<div class="card">
    <h1>Ledeynam<br>will you be my Valentine? 💘</h1>
    <div class="buttons">
        <button id="yesBtn">Yes 💖</button>
        <button id="noBtn">No 🙈</button>
    </div>
    <div id="yay">YAAAAAAYYY!!!!!! 🎉💖</div>
    <img id="meme" src="https://pixabay.com/de/gifs/herz-liebe-valentinstag-rosa-rot-12791.gif" alt="Funny Valentine Hearts GIF">
</div>
<script>
    const noBtn=document.getElementById("noBtn"), yesBtn=document.getElementById("yesBtn"), yay=document.getElementById("yay"), meme=document.getElementById("meme");
    function moveNoButton(){const x=Math.random()*250,y=Math.random()*40;noBtn.style.left=x+"px",noBtn.style.top=y+"px"}
    noBtn.addEventListener("mouseover",moveNoButton),noBtn.addEventListener("touchstart",moveNoButton);
    yesBtn.addEventListener("click",()=>{yay.style.display="block",meme.style.display="block"});
</script>
</body>
</html>
